name: CloakTools
options:
  bundleIdPrefix: com.cloakyard
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "20261124.2"
    CLOAKTOOLS_RELEASE_CHANNEL: "Beta"
    CLOAKTOOLS_APP_GROUP: ""
    CLOAKTOOLS_SOURCE_ROOT: $(SRCROOT)
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  CloakToolsCore:
    path: Packages/CloakToolsCore
targets:
  CloakTools:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Resources/Info.plist, Resources/CloakTools.entitlements, Resources/CloakTools.Release.entitlements]
      - path: ../../assets/icon/CloakTools.icon
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
    postBuildScripts:
      - name: Embed local media codecs and corresponding source
        inputFiles:
          - $(SRCROOT)/scripts/codecs/build.py
          - $(SRCROOT)/scripts/codecs/sources.json
          - $(SRCROOT)/scripts/codecs/embed.sh
          - $(SRCROOT)/scripts/codecs/build_jxl.py
          - $(SRCROOT)/scripts/codecs/jxl-sources.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/Media/ffmpeg
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/Media/ffprobe
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/Media/cjxl
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/Media/djxl
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Codec Sources.zip
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/JPEG XL Sources.zip
        script: /bin/bash "${SRCROOT}/scripts/codecs/embed.sh"
      - name: Sign Sparkle helpers for an explicit signing identity
        basedOnDependencyAnalysis: false
        script: /bin/bash "${SRCROOT}/../../scripts/sign-sparkle.sh"
    dependencies:
      - package: Sparkle
      - package: CloakToolsCore
      - target: cloakopt
        embed: true
        link: false
        copy:
          destination: executables
      - target: CloakToolsFinder
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloaktools
        PRODUCT_NAME: CloakTools
        CODE_SIGN_ENTITLEMENTS: App/Resources/CloakTools.entitlements
        SPARKLE_PUBLIC_ED_KEY: "KcgLTg+iK7QXkwQ1j1GuDZYSZtlQ+QZvEMWP43502i4="
        SPARKLE_FEED_URL: https://tools.cloakyard.com/updates/appcast.xml
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: CloakTools
    info:
      path: App/Resources/Info.plist
      properties:
        SUFeedURL: "$(SPARKLE_FEED_URL)"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: CloakTools
        CloakToolsReleaseChannel: $(CLOAKTOOLS_RELEASE_CHANNEL)
        CloakToolsAppGroupIdentifier: $(CLOAKTOOLS_APP_GROUP)
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Sumit Sahoo. MIT License."
        CFBundleURLTypes:
          - CFBundleURLName: Web and email links
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https, mailto]
          - CFBundleURLName: Finder action requests
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [cloaktools-action]
        NSServices:
          - NSMenuItem:
              default: Folder Actions with CloakTools
            NSMessage: folderActions
            NSPortName: CloakTools
            NSSendFileTypes: [public.folder]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Copy or Export File List with CloakTools
            NSMessage: copyAs
            NSPortName: CloakTools
            NSSendFileTypes: [public.item]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Optimize Media with CloakTools
            NSMessage: optimizeMedia
            NSPortName: CloakTools
            NSSendFileTypes: [public.image, com.adobe.pdf, public.movie, public.audio]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Make It Fit with CloakTools
            NSMessage: fitImage
            NSPortName: CloakTools
            NSSendFileTypes: [public.png, public.jpeg, public.tiff, public.heic, public.heif]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Read QR Code from Image with CloakTools
            NSMessage: readQR
            NSPortName: CloakTools
            NSSendFileTypes: [public.png, public.jpeg, com.compuserve.gif, org.webmproject.webp, public.tiff, public.heic, public.heif]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Collect Copies for Sharing with CloakTools
            NSMessage: collectCopies
            NSPortName: CloakTools
            NSSendFileTypes: [public.data]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
  cloakopt:
    type: tool
    platform: macOS
    sources: [CLI]
    dependencies:
      - package: CloakToolsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloaktools.cloakopt
        SKIP_INSTALL: YES
  CloakToolsFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes: [Info.plist, FinderExtension.entitlements, FinderExtension.Release.entitlements]
    dependencies:
      - package: CloakToolsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloaktools.finder
        PRODUCT_NAME: CloakToolsFinder
        CODE_SIGN_ENTITLEMENTS: $(CLOAKTOOLS_SOURCE_ROOT)/FinderExtension/FinderExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: FinderExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: CloakTools Finder
        CloakToolsReleaseChannel: $(CLOAKTOOLS_RELEASE_CHANNEL)
        CloakToolsAppGroupIdentifier: $(CLOAKTOOLS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
  CloakToolsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Packages/CloakToolsCore/Tests/CloakToolsCoreTests/Support/MediaFixtures.swift
    dependencies:
      - target: CloakTools
      - package: CloakToolsCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloaktools.tests
schemes:
  CloakTools:
    build:
      targets:
        CloakTools: all
    run:
      config: Debug
    test:
      targets: [CloakToolsTests]
