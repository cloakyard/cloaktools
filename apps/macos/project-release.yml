# Use the enrolled team for an Organizer archive or the signed release script.
# The regular project spec supports local ad-hoc builds without App Groups.
include: [project.yml]
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CLOAKTOOLS_RELEASE_CHANNEL: "Beta"
    CLOAKTOOLS_APP_GROUP: $(DEVELOPMENT_TEAM).com.cloakyard.cloaktools
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: --timestamp
targets:
  CloakTools:
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: $(CLOAKTOOLS_SOURCE_ROOT)/App/Resources/CloakTools.Release.entitlements
  CloakToolsFinder:
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: $(CLOAKTOOLS_SOURCE_ROOT)/FinderExtension/FinderExtension.Release.entitlements
